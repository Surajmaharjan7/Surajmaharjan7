<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Do You Love Me?</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e5, #fff0f5);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
      background: white;
      padding: 35px 20px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    h1 {
      font-size: clamp(26px, 8vw, 36px);
      color: #ff3366;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    button {
      min-width: 120px;
      min-height: 55px;
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    #yes {
      background: #ff3366;
      color: white;
    }
    #no {
      background: #777;
      color: white;
    }
    #message {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      color: #ff3366;
      min-height: 30px;
    }
    @media (max-width: 350px) {
      .buttons {
        flex-direction: column;
        align-items: center;
      }
      button {
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Do you love me? ❤️</h1>
    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 😢</button>
    </div>
    <div id="message"></div>
  </div>
  <script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const message = document.getElementById("message");
    function sayYes() {
      message.innerHTML = "YES ❤️ I knew you love me! 😍";
    }
    yes.addEventListener("click", sayYes);
    no.addEventListener("click", () => {
      // No is not an option 😈
      no.innerHTML = "Yes ❤️";
      no.style.background = "#ff3366";
      message.innerHTML = "YES ❤️ You love me! 😘";
    });
  </script>
</body>
</html>
