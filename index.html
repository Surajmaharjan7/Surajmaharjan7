<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mero Photo haru</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================
   LOADING SCREEN
===================================== */

.loading-screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    background: #000;
    color: #fff;

    overflow: hidden;

    z-index: 9999;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}

.loading-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* =====================================
   LOADING TEXT
===================================== */

.loading {
    font-size: clamp(22px, 6vw, 75px);

    font-weight: 900;

    letter-spacing: 0.12em;

    user-select: none;

    animation:
        loadingPulse 0.25s infinite alternate,
        loadingShake 0.4s infinite;
}

.dots {
    display: inline-block;
    width: 3ch;
    text-align: left;
}


/* =====================================
   COUNTER
===================================== */

.number {
    margin-top: 30px;

    font-size:
        clamp(
            50px,
            13vw,
            150px
        );

    font-weight: 900;

    font-variant-numeric: tabular-nums;

    letter-spacing: 0.03em;

    user-select: none;

    text-shadow:
        0 0 8px currentColor,
        0 0 20px currentColor,
        0 0 45px currentColor;

    animation:
        numberPulse 0.05s infinite alternate;
}


/* =====================================
   NAME
===================================== */

.rate {
    margin-top: 15px;

    font-size: 13px;

    letter-spacing: 0.3em;

    opacity: 0.55;

    user-select: none;
}


/* =====================================
   SCANLINES
===================================== */

.scanlines {
    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(0,0,0,0.12) 4px
        );

    opacity: 0.5;

    mix-blend-mode: difference;

    z-index: 10000;
}


/* =====================================
   GLITCH
===================================== */

.glitch {
    position: fixed;

    left: 0;

    width: 100%;

    height: 2px;

    background: currentColor;

    pointer-events: none;

    opacity: 0;

    z-index: 10001;
}


/* =====================================
   PROGRESS BAR
===================================== */

.progress {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 5px;

    background: currentColor;

    transform-origin: left;

    animation:
        progress 0.6s linear infinite;

    z-index: 10002;
}


/* =====================================
   GALLERY
===================================== */

.gallery-page {
    min-height: 100vh;

    background: #000;

    padding:
        0 25px 40px;

    opacity: 0;

    transform:
        translateY(20px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.gallery-page.show {
    opacity: 1;

    transform:
        translateY(0);
}


/* =====================================
   SMART HEADER
===================================== */

.gallery-header {

    position: sticky;

    top: 0;

    z-index: 100;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding:
        20px 5px;

    margin-bottom: 25px;

    background:
        rgba(0,0,0,0.92);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    border-bottom:
        1px solid
        rgba(255,255,255,0.2);

    transition:
        transform 0.35s ease,
        opacity 0.35s ease;
}


/* Hide when scrolling down */

.gallery-header.header-hidden {

    transform:
        translateY(-100%);

    opacity: 0;
}


/* =====================================
   HEADER TITLE
===================================== */

.gallery-title {

    font-size:
        clamp(
            20px,
            4vw,
            42px
        );

    font-weight: 900;

    letter-spacing:
        0.15em;
}


/* =====================================
   HEADER COUNT
===================================== */

.gallery-count {

    font-size: 11px;

    letter-spacing:
        0.25em;

    opacity: 0.5;
}


/* =====================================
   IMAGE GRID
===================================== */

.gallery {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}


/* =====================================
   PHOTO
===================================== */

.photo {

    position: relative;

    width: 100%;

    aspect-ratio: 4 / 3;

    overflow: hidden;

    background: #111;

    cursor: pointer;

    opacity: 0;

    transform:
        translateY(20px);

    animation:
        photoAppear
        0.7s
        ease
        forwards;
}


/* =====================================
   IMAGE
===================================== */

.photo img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    filter:
        grayscale(100%);

    transition:
        transform 0.5s ease,
        filter 0.5s ease;
}


/* =====================================
   IMAGE HOVER
===================================== */

.photo:hover img {

    transform:
        scale(1.06);

    filter:
        grayscale(0%);
}


/* =====================================
   PHOTO NUMBER
===================================== */

.photo-number {

    position: absolute;

    left: 10px;

    bottom: 10px;

    padding:
        5px 8px;

    font-size: 10px;

    letter-spacing:
        0.15em;

    background:
        rgba(0,0,0,0.7);

    color: #fff;

    z-index: 2;
}


/* =====================================
   PHOTO BORDER
===================================== */

.photo::after {

    content: "";

    position: absolute;

    inset: 0;

    border:
        1px solid
        transparent;

    transition:
        border 0.3s ease;
}

.photo:hover::after {

    border:
        1px solid
        rgba(255,255,255,0.8);
}


/* =====================================
   FULLSCREEN VIEWER
===================================== */

.viewer {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.95);

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.3s ease;

    z-index: 20000;
}

.viewer.active {

    opacity: 1;

    visibility: visible;
}


/* =====================================
   FULLSCREEN IMAGE
===================================== */

.viewer img {

    max-width: 95vw;

    max-height: 90vh;

    object-fit: contain;

    box-shadow:
        0 0 40px
        rgba(255,255,255,0.15);
}


/* =====================================
   CLOSE BUTTON
===================================== */

.close {

    position: fixed;

    top: 20px;

    right: 25px;

    font-size: 35px;

    color: #fff;

    cursor: pointer;

    user-select: none;

    z-index: 20001;
}


/* =====================================
   ANIMATIONS
===================================== */

@keyframes loadingPulse {

    from {
        transform: scale(1);
        opacity: 0.55;
    }

    to {
        transform: scale(1.08);
        opacity: 1;
    }

}


@keyframes loadingShake {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-2px);
    }

    50% {
        transform: translateX(2px);
    }

    75% {
        transform: translateX(-1px);
    }

    100% {
        transform: translateX(1px);
    }

}


@keyframes numberPulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.025);
    }

}


@keyframes progress {

    from {
        transform: scaleX(0);
    }

    to {
        transform: scaleX(1);
    }

}


@keyframes photoAppear {

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* =====================================
   TABLET
===================================== */

@media (max-width: 900px) {

    .gallery {

        grid-template-columns:
            repeat(3, 1fr);

    }

}


/* =====================================
   MOBILE
===================================== */

@media (max-width: 600px) {

    .gallery-page {

        padding:
            0 10px 30px;

    }


    .gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 6px;

    }


    .gallery-header {

        padding:
            15px 3px;

        margin-bottom:
            15px;

    }


    .gallery-title {

        font-size:
            20px;

    }


    .gallery-count {

        font-size:
            8px;

    }


    .loading {

        font-size:
            23px;

    }


    .number {

        font-size:
            58px;

    }


    .rate {

        font-size:
            9px;

    }

}


/* =====================================
   VERY SMALL MOBILE
===================================== */

@media (max-width: 350px) {

    .gallery {

        grid-template-columns:
            1fr;

    }

}

</style>
</head>


<body>


<!-- =====================================
     LOADING SCREEN
===================================== -->

<div
    class="loading-screen"
    id="loadingScreen"
>

    <div class="loading">

        LOADING

        <span
            class="dots"
            id="dots"
        >.</span>

    </div>


    <div
        class="number"
        id="number"
    >
        0
    </div>


    <div class="rate">

        Suraj Maharjan

        <br>

        VESUN INTERIOR

    </div>

</div>


<!-- =====================================
     EFFECTS
===================================== -->

<div class="scanlines"></div>

<div
    class="glitch"
    id="glitch"
></div>

<div class="progress"></div>


<!-- =====================================
     GALLERY
===================================== -->

<main
    class="gallery-page"
    id="galleryPage"
>


    <!-- HEADER -->

    <header
        class="gallery-header"
        id="galleryHeader"
    >

        <div class="gallery-title">

            Some Images !!!

        </div>


        <div class="gallery-count">

            Old and New Mixed

        </div>

    </header>


    <!-- IMAGE GRID -->

    <section
        class="gallery"
        id="gallery"
    ></section>


</main>


<!-- =====================================
     FULLSCREEN VIEWER
===================================== -->

<div
    class="viewer"
    id="viewer"
>

    <div
        class="close"
        id="close"
    >
        ×
    </div>


    <img
        id="viewerImage"
        src=""
        alt="Photo"
    >

</div>


<script>


/* =====================================
   LOADING COUNTER
===================================== */

const numberElement =
    document.getElementById("number");

let number = 0;


const counter =
    setInterval(() => {

        number++;

        numberElement.textContent =
            number.toLocaleString();


        if (number >= 100) {

            clearInterval(counter);

        }

    }, 10);


/* =====================================
   LOADING DOTS
===================================== */

const dots =
    document.getElementById("dots");

let dotCount = 0;


setInterval(() => {

    dotCount++;


    if (dotCount > 3) {

        dotCount = 0;

    }


    dots.textContent =
        ".".repeat(dotCount);

}, 180);


/* =====================================
   LOADING VISUAL EFFECT
===================================== */

const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );

let pulse = 0;


function visualEffect() {

    pulse += 0.12;


    const wave =
        (Math.sin(pulse) + 1) / 2;


    const brightness =
        Math.round(
            wave * 255
        );


    loadingScreen.style.background =
        `rgb(
            ${brightness},
            ${brightness},
            ${brightness}
        )`;


    loadingScreen.style.color =
        brightness > 135
            ? "#000"
            : "#fff";


    const shake =
        Math.sin(
            pulse * 3
        ) * 2;


    const vertical =
        Math.cos(
            pulse * 2
        ) * 1.5;


    loadingScreen.style.transform =
        `translate(
            ${shake}px,
            ${vertical}px
        )`;


    const contrast =
        100 +
        Math.abs(
            Math.sin(
                pulse * 2
            )
        ) * 70;


    loadingScreen.style.filter =
        `contrast(${contrast}%)`;


    requestAnimationFrame(
        visualEffect
    );

}


visualEffect();


/* =====================================
   RANDOM GLITCH BARS
===================================== */

const glitch =
    document.getElementById(
        "glitch"
    );


setInterval(() => {

    const position =
        Math.random() * 100;


    const height =
        Math.random() * 8 + 1;


    glitch.style.top =
        position + "%";


    glitch.style.height =
        height + "px";


    glitch.style.opacity =
        Math.random() * 0.8;


    glitch.style.transform =
        `translateX(
            ${(Math.random() - 0.5) * 40}px
        )`;


    setTimeout(() => {

        glitch.style.opacity = 0;

    }, 40);

}, 120);


/* =====================================
   CREATE RANDOM IMAGE ORDER
===================================== */

const gallery =
    document.getElementById(
        "gallery"
    );


/*
Create numbers 1 to 84
*/

let imageNumbers = [];


for (
    let i = 1;
    i <= 84;
    i++
) {

    imageNumbers.push(i);

}


/*
Fisher-Yates shuffle

This creates a new random
order every time the page
is refreshed.
*/

for (
    let i = imageNumbers.length - 1;
    i > 0;
    i--
) {

    const randomIndex =
        Math.floor(
            Math.random() * (i + 1)
        );


    [
        imageNumbers[i],
        imageNumbers[randomIndex]

    ] = [

        imageNumbers[randomIndex],
        imageNumbers[i]

    ];

}


/* =====================================
   CREATE PHOTOS
===================================== */

const viewer =
    document.getElementById(
        "viewer"
    );


const viewerImage =
    document.getElementById(
        "viewerImage"
    );


imageNumbers.forEach(
    (imageNumber, index) => {

        const photo =
            document.createElement(
                "div"
            );


        photo.className =
            "photo";


        /*
        Stagger the entrance
        */

        photo.style.animationDelay =
            `${index * 0.025}s`;


        photo.innerHTML = `

            <img
                src="${imageNumber}.jpg"
                alt="Photo ${imageNumber}"
                loading="lazy"
            >

            <div class="photo-number">

                ${String(imageNumber).padStart(2, "0")}

            </div>

        `;


        gallery.appendChild(
            photo
        );


        /* ================================
           OPEN FULLSCREEN
        ================================= */

        photo.addEventListener(
            "click",
            () => {

                const image =
                    photo.querySelector(
                        "img"
                    );


                viewerImage.src =
                    image.src;


                viewer.classList.add(
                    "active"
                );

            }
        );

    }
);


/* =====================================
   CLOSE VIEWER
===================================== */

const close =
    document.getElementById(
        "close"
    );


close.addEventListener(
    "click",
    () => {

        viewer.classList.remove(
            "active"
        );

        viewerImage.src = "";

    }
);


/* =====================================
   CLICK OUTSIDE IMAGE
===================================== */

viewer.addEventListener(
    "click",
    (event) => {

        if (
            event.target === viewer
        ) {

            viewer.classList.remove(
                "active"
            );

            viewerImage.src = "";

        }

    }
);


/* =====================================
   ESC KEY
===================================== */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape"
        ) {

            viewer.classList.remove(
                "active"
            );

            viewerImage.src = "";

        }

    }
);


/* =====================================
   SMART HEADER
===================================== */

const header =
    document.getElementById(
        "galleryHeader"
    );


let lastScrollY =
    window.scrollY;


window.addEventListener(
    "scroll",
    () => {

        const currentScrollY =
            window.scrollY;


        /* =============================
           AT TOP
        ============================= */

        if (
            currentScrollY <= 20
        ) {

            header.classList.remove(
                "header-hidden"
            );

            lastScrollY =
                currentScrollY;

            return;

        }


        /* =============================
           SCROLL DOWN
        ============================= */

        if (
            currentScrollY >
            lastScrollY
        ) {

            header.classList.add(
                "header-hidden"
            );

        }


        /* =============================
           SCROLL UP
        ============================= */

        else if (
            currentScrollY <
            lastScrollY
        ) {

            header.classList.remove(
                "header-hidden"
            );

        }


        lastScrollY =
            currentScrollY;

    },

    {
        passive: true
    }

);


/* =====================================
   SHOW GALLERY
===================================== */

setTimeout(() => {

    loadingScreen.classList.add(
        "hide"
    );


    document
        .getElementById(
            "galleryPage"
        )
        .classList.add(
            "show"
        );

}, 1200);

</script>

</body>
</html>
