<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Infinite Bouncing Balls</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .counter {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 10;
      background: rgba(255,255,255,0.1);
      padding: 8px 15px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>

<body>

  <div class="counter">
    Balls: <span id="count">1</span>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const countText = document.getElementById("count");

    let balls = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();


    // Create a ball
    function createBall(x, y, vx, vy, radius = 8) {

      return {
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        radius: radius,

        color: `hsl(${Math.random() * 360}, 100%, 60%)`
      };
    }


    // First ball
    balls.push(
      createBall(
        canvas.width / 2,
        canvas.height / 2,
        3,
        3
      )
    );


    function addBall(ball, side) {

      // New random direction
      let speed = 2 + Math.random() * 3;

      let angle = Math.random() * Math.PI * 2;

      let newBall = createBall(
        ball.x,
        ball.y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        6 + Math.random() * 5
      );

      balls.push(newBall);
    }


    function update() {

      for (let ball of balls) {

        ball.x += ball.vx;
        ball.y += ball.vy;

        let hit = false;
        let side = "";


        // Left wall
        if (ball.x - ball.radius <= 0) {

          ball.x = ball.radius;
          ball.vx *= -1;

          hit = true;
          side = "left";
        }


        // Right wall
        if (ball.x + ball.radius >= canvas.width) {

          ball.x = canvas.width - ball.radius;
          ball.vx *= -1;

          hit = true;
          side = "right";
        }


        // Top wall
        if (ball.y - ball.radius <= 0) {

          ball.y = ball.radius;
          ball.vy *= -1;

          hit = true;
          side = "top";
        }


        // Bottom wall
        if (ball.y + ball.radius >= canvas.height) {

          ball.y = canvas.height - ball.radius;
          ball.vy *= -1;

          hit = true;
          side = "bottom";
        }


        // Duplicate when hitting wall
        if (hit) {

          // Prevent every frame from creating balls
          if (!ball.cooldown) {

            addBall(ball, side);

            ball.cooldown = true;

            setTimeout(() => {
              ball.cooldown = false;
            }, 100);
          }
        }
      }


      countText.textContent = balls.length;
    }


    function draw() {

      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);


      for (let ball of balls) {

        // Glow
        ctx.beginPath();

        ctx.arc(
          ball.x,
          ball.y,
          ball.radius + 8,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = ball.color;
        ctx.globalAlpha = 0.15;
        ctx.fill();


        // Ball
        ctx.beginPath();

        ctx.arc(
          ball.x,
          ball.y,
          ball.radius,
          0,
          Math.PI * 2
        );

        ctx.globalAlpha = 1;
        ctx.fillStyle = ball.color;
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }


    function animate() {

      update();
      draw();

      requestAnimationFrame(animate);
    }


    animate();

  </script>

</body>
</html>
