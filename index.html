<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interior Line Art</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #ffffff;
        font-family: Arial, sans-serif;
    }

    .interior {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    svg {
        width: 100%;
        max-width: 1200px;
        height: auto;
    }

    .line {
        fill: none;
        stroke: #222;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .thin {
        stroke-width: 1.2;
    }

    .heavy {
        stroke-width: 3;
    }
</style>
</head>

<body>

<div class="interior">

<svg viewBox="0 0 1200 700"
     xmlns="http://www.w3.org/2000/svg">

    <!-- WALL -->
    <path class="line heavy"
          d="M80 100 L1120 100 L1120 570 L80 570 Z"/>

    <!-- CEILING -->
    <path class="line"
          d="M80 100 L150 45 L1050 45 L1120 100"/>
    <path class="line thin"
          d="M150 45 L150 80"/>
    <path class="line thin"
          d="M1050 45 L1050 80"/>

    <!-- LEFT WINDOW -->
    <rect x="100" y="150" width="230" height="300" class="line"/>
    <line x1="215" y1="150" x2="215" y2="450" class="line"/>
    <line x1="100" y1="300" x2="330" y2="300" class="line"/>

    <!-- WINDOW PLANTS -->
    <path class="line thin"
          d="M145 440
             C125 400 140 370 120 340
             M145 440
             C155 400 170 370 160 330
             M145 410
             C120 390 115 370 125 350
             M150 390
             C175 370 180 345 165 325"/>

    <path class="line thin"
          d="M275 440
             C260 400 275 370 260 340
             M275 440
             C290 400 305 375 295 340
             M275 400
             C250 380 245 360 255 345
             M280 380
             C300 365 310 345 300 325"/>

    <!-- TV WALL -->
    <rect x="850" y="180" width="220" height="250" class="line"/>
    <rect x="875" y="205" width="170" height="150" class="line heavy"/>

    <!-- TV -->
    <rect x="890" y="220" width="140" height="120" class="line"/>
    <line x1="960" y1="340" x2="960" y2="355" class="line"/>
    <line x1="930" y1="355" x2="990" y2="355" class="line"/>

    <!-- TV CONSOLE -->
    <rect x="820" y="430" width="280" height="70" class="line"/>
    <line x1="820" y1="465" x2="1100" y2="465" class="thin"/>
    <line x1="890" y1="430" x2="890" y2="500" class="thin"/>
    <line x1="1030" y1="430" x2="1030" y2="500" class="thin"/>

    <!-- DECOR -->
    <circle cx="875" cy="410" r="12" class="line"/>
    <path class="line"
          d="M875 398 C860 380 865 365 875 350
             M875 385 C890 370 895 355 890 345"/>

    <!-- CENTER FEATURE WALL -->
    <rect x="360" y="150" width="400" height="330" class="line"/>

    <!-- WOOD SLATS -->
    <g class="thin">
        <line x1="380" y1="150" x2="380" y2="480"/>
        <line x1="395" y1="150" x2="395" y2="480"/>
        <line x1="410" y1="150" x2="410" y2="480"/>
        <line x1="425" y1="150" x2="425" y2="480"/>
        <line x1="440" y1="150" x2="440" y2="480"/>
        <line x1="455" y1="150" x2="455" y2="480"/>
        <line x1="470" y1="150" x2="470" y2="480"/>
        <line x1="485" y1="150" x2="485" y2="480"/>
    </g>

    <!-- WALL ART -->
    <rect x="530" y="190" width="130" height="160" class="line"/>
    <rect x="545" y="205" width="100" height="130" class="line thin"/>

    <path class="line thin"
          d="M555 315
             C575 280 590 295 605 265
             C620 240 630 250 640 220"/>

    <!-- SOFA -->
    <rect x="400" y="390" width="390" height="110" rx="12" class="line heavy"/>

    <!-- SOFA BACK -->
    <line x1="415" y1="430" x2="775" y2="430" class="line"/>

    <!-- SOFA SECTIONS -->
    <line x1="495" y1="430" x2="495" y2="500" class="thin"/>
    <line x1="590" y1="430" x2="590" y2="500" class="thin"/>
    <line x1="685" y1="430" x2="685" y2="500" class="thin"/>

    <!-- CUSHIONS -->
    <rect x="430" y="400" width="60" height="50" rx="8" class="line thin"/>
    <rect x="515" y="400" width="60" height="50" rx="8" class="line thin"/>
    <rect x="610" y="400" width="60" height="50" rx="8" class="line thin"/>
    <rect x="700" y="400" width="60" height="50" rx="8" class="line thin"/>

    <!-- COFFEE TABLE -->
    <rect x="480" y="525" width="230" height="65" class="line heavy"/>
    <line x1="500" y1="590" x2="500" y2="630" class="line"/>
    <line x1="690" y1="590" x2="690" y2="630" class="line"/>

    <!-- TABLE DECOR -->
    <ellipse cx="595" cy="545" rx="35" ry="10" class="line"/>
    <path class="line thin"
          d="M595 545 C580 520 585 505 595 490
             M595 545 C610 520 610 505 595 490
             M595 520 C575 510 575 495 585 485
             M600 520 C620 510 620 495 610 485"/>

    <!-- LEFT ARMCHAIR -->
    <path class="line heavy"
          d="M180 430
             Q160 390 185 365
             Q210 345 250 365
             Q280 385 275 430
             L265 500
             L195 500 Z"/>

    <line x1="190" y1="430" x2="265" y2="430" class="thin"/>
    <line x1="200" y1="500" x2="195" y2="545" class="line"/>
    <line x1="255" y1="500" x2="260" y2="545" class="line"/>

    <!-- FLOOR -->
    <path class="line"
          d="M80 570 L1120 570 L1170 650 L30 650 Z"/>

    <!-- FLOOR LINES -->
    <g class="thin">
        <line x1="150" y1="570" x2="120" y2="650"/>
        <line x1="250" y1="570" x2="240" y2="650"/>
        <line x1="850" y1="570" x2="880" y2="650"/>
        <line x1="950" y1="570" x2="990" y2="650"/>
    </g>

    <!-- RIGHT DOOR -->
    <rect x="760" y="150" width="70" height="330" class="line"/>
    <circle cx="815" cy="320" r="4" class="line"/>

    <!-- CEILING LIGHTS -->
    <circle cx="350" cy="90" r="7" class="line"/>
    <circle cx="600" cy="90" r="7" class="line"/>
    <circle cx="850" cy="90" r="7" class="line"/>

</svg>

</div>

</body>
</html>
