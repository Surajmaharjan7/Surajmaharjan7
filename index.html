<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOON LOADING WAIT xD</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
}
.screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #000;
    color: #fff;
    position: relative;
    overflow: hidden;
    transition:
        background 0.035s ease,
        color 0.035s ease,
        transform 0.035s ease,
        filter 0.035s ease;
}
/* =====================================
   LOADING
===================================== */
.loading {
    font-size: clamp(22px, 6vw, 75px);
    font-weight: 900;
    letter-spacing: 0.12em;
    user-select: none;
    animation:
        loadingPulse 0.25s infinite alternate,
        loadingShake 0.4s infinite;
}
.dots {
    display: inline-block;
    width: 3ch;
    text-align: left;
}
/* =====================================
   NUMBER
===================================== */
.number {
    margin-top: 30px;
    font-size: clamp(
        50px,
        13vw,
        150px
    );
    font-weight: 900;
    font-variant-numeric:
        tabular-nums;
    letter-spacing: 0.03em;
    user-select: none;
    text-shadow:
        0 0 8px currentColor,
        0 0 20px currentColor,
        0 0 45px currentColor;
    animation:
        numberPulse 0.12s infinite alternate;
}
/* =====================================
   SPEED
===================================== */
.rate {
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 0.3em;
    opacity: 0.55;
    user-select: none;
}
/* =====================================
   SCANLINES
===================================== */
.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(0,0,0,0.12) 4px
        );
    opacity: 0.5;
    mix-blend-mode: difference;
}
/* =====================================
   GLITCH LINES
===================================== */
.glitch {
    position: fixed;
    left: 0;
    width: 100%;
    height: 2px;
    background: currentColor;
    pointer-events: none;
    opacity: 0;
}
/* =====================================
   BOTTOM BAR
===================================== */
.progress {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 5px;
    background: currentColor;
    transform-origin: left;
    animation:
        progress 0.6s linear infinite;
}
/* =====================================
   ANIMATIONS
===================================== */
@keyframes loadingPulse {
    from {
        transform: scale(1);
        opacity: 0.55;
    }
    to {
        transform: scale(1.08);
        opacity: 1;
    }
}
@keyframes loadingShake {
    0% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-2px);
    }
    50% {
        transform: translateX(2px);
    }
    75% {
        transform: translateX(-1px);
    }
    100% {
        transform: translateX(1px);
    }
}
@keyframes numberPulse {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.025);
    }
}
@keyframes progress {
    from {
        transform: scaleX(0);
    }
    to {
        transform: scaleX(1);
    }
}
/* =====================================
   REDUCED MOTION
===================================== */
@media (prefers-reduced-motion: reduce) {
    .screen,
    .loading,
    .number,
    .progress {
        animation-duration: 2s !important;
    }
}
/* =====================================
   MOBILE
===================================== */
@media (max-width: 600px) {
    .loading {
        font-size: 23px;
    }
    .number {
        font-size: 58px;
    }
    .rate {
        font-size: 9px;
    }
}
</style>
</head>
<body>
<div
    class="screen"
    id="screen"
>
    <div class="loading">
        We are on to it
        <br>LOADING WAIT
        <span
            class="dots"
            id="dots"
        >.</span>
    </div>
    <div
        class="number"
        id="number"
    >
        0
    </div>
    <div
        class="rate"
        id="rate"
    >
        100 NUMBERS / SECOND
    </div>
</div>
<div class="scanlines"></div>
<div class="glitch" id="glitch"></div>
<div class="progress"></div>
<script>
/* =====================================
   COUNTER
===================================== */
const numberElement =
    document.getElementById("number");
let number = 0;
/*
100 numbers every second.
1000ms / 100
= 10ms per number
*/
const interval = 10;
setInterval(() => {
    number++;
    numberElement.textContent =
        number.toLocaleString();
}, interval);
/* =====================================
   LOADING DOTS
===================================== */
const dots =
    document.getElementById("dots");
let dotCount = 0;
setInterval(() => {
    dotCount++;
    if (dotCount > 3) {
        dotCount = 0;
    }
    dots.textContent =
        ".".repeat(dotCount);
}, 180);
/* =====================================
   RAPID HIGH-CONTRAST PULSE
===================================== */
const screen =
    document.getElementById("screen");
let pulse = 0;
function visualEffect() {
    pulse += 0.12;
    /*
    Rapid brightness movement.
    Uses fading instead of a hard
    seizure-inducing strobe.
    */
    const wave =
        (Math.sin(pulse) + 1) / 2;
    const brightness =
        Math.round(
            wave * 255
        );
    screen.style.background =
        `rgb(
            ${brightness},
            ${brightness},
            ${brightness}
        )`;
    screen.style.color =
        brightness > 135
            ? "#000"
            : "#fff";
    /*
    Small random movement
    */
    const shake =
        Math.sin(pulse * 3) * 2;
    const vertical =
        Math.cos(pulse * 2) * 1.5;
    screen.style.transform =
        `translate(
            ${shake}px,
            ${vertical}px
        )`;
    /*
    Contrast distortion
    */
    const contrast =
        100 +
        Math.abs(
            Math.sin(pulse * 2)
        ) * 70;
    screen.style.filter =
        `contrast(${contrast}%)`;
    requestAnimationFrame(
        visualEffect
    );
}
visualEffect();
/* =====================================
   RANDOM GLITCH BARS
===================================== */
const glitch =
    document.getElementById("glitch");
setInterval(() => {
    const position =
        Math.random() * 100;
    const height =
        Math.random() * 8 + 1;
    glitch.style.top =
        position + "%";
    glitch.style.height =
        height + "px";
    glitch.style.opacity =
        Math.random() * 0.8;
    glitch.style.transform =
        `translateX(
            ${(Math.random() - 0.5) * 40}px
        )`;
    setTimeout(() => {
        glitch.style.opacity = 0;
    }, 40);
}, 120);
</script>
</body>
</html>
