<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me? ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #fff5f8);
      font-family: Arial, sans-serif;
    }
    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
      background: white;
      padding: 35px 20px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    h1 {
      color: #ff3366;
      font-size: 30px;
      margin-bottom: 30px;
    }
    .buttons {
      position: relative;
      height: 80px;
    }
    button {
      position: absolute;
      top: 10px;
      width: 120px;
      height: 55px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      touch-action: manipulation;
    }
    #yes {
      left: 10%;
      background: #ff3366;
      color: white;
    }
    #no {
      left: 55%;
      background: #777;
      color: white;
      transition: left 0.15s ease, top 0.15s ease;
    }
    #message {
      min-height: 30px;
      margin-top: 20px;
      font-size: 21px;
      font-weight: bold;
      color: #ff3366;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Are you stupid ? ❤️</h1>
    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 😢</button>
    </div>
    <div id="message"></div>
  </div>
  <script>
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const message = document.getElementById("message");
    // YES always works ❤️
    yesButton.addEventListener("click", () => {
      message.innerHTML = "YES! ❤️ I knew you love me! 😍";
    });
    // NO runs away EVERY SINGLE TIME 😈
    function runAway(event) {
      if (event) event.preventDefault();
      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;
      const maxX = window.innerWidth - buttonWidth - 10;
      const maxY = window.innerHeight - buttonHeight - 10;
      const randomX = Math.max(10, Math.random() * maxX);
      const randomY = Math.max(10, Math.random() * maxY);
      // Change to fixed so it can run anywhere on the screen
      noButton.style.position = "fixed";
      noButton.style.left = randomX + "px";
      noButton.style.top = randomY + "px";
      message.innerHTML = "Nice try 😏 ❤️";
    }
    // Works every time on phone
    noButton.addEventListener("click", runAway);
    // Also works if they tap quickly
    noButton.addEventListener("touchstart", runAway, {
      passive: false
    });
  </script>
</body>
</html>
