<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suraj Maharjan</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        transition: background 0.08s ease;
    }
    .screen {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition:
            background 0.08s ease,
            color 0.08s ease,
            filter 0.08s ease;
    }
    .loading {
        font-size: clamp(28px, 7vw, 80px);
        font-weight: 900;
        letter-spacing: 0.15em;
        animation:
            pulse 0.35s infinite alternate,
            glitch 0.7s infinite;
    }
    .dots {
        display: inline-block;
        width: 3ch;
        text-align: left;
    }
    .number {
        margin-top: 30px;
        font-size: clamp(35px, 9vw, 110px);
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        text-shadow:
            0 0 10px currentColor,
            0 0 30px currentColor;
        transition: transform 0.05s;
    }
    .rate {
        margin-top: 12px;
        font-size: 13px;
        letter-spacing: 0.25em;
        opacity: 0.55;
        text-transform: uppercase;
    }
    .progress {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: currentColor;
        transform-origin: left;
        animation: progress 1s linear infinite;
    }
    /* Subtle visual pulse rather than dangerous hard strobing */
    @keyframes pulse {
        from {
            transform: scale(1);
            opacity: 0.65;
        }
        to {
            transform: scale(1.05);
            opacity: 1;
        }
    }
    @keyframes glitch {
        0%, 90%, 100% {
            filter: none;
        }
        92% {
            filter: blur(1px);
            transform: translateX(-3px);
        }
        94% {
            filter: contrast(2);
            transform: translateX(3px);
        }
        96% {
            filter: none;
            transform: translateX(0);
        }
    }
    @keyframes progress {
        from {
            transform: scaleX(0);
        }
        to {
            transform: scaleX(1);
        }
    }
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 4s !important;
            animation-iteration-count: infinite !important;
        }
    }
</style>
</head>
<body>
<div class="screen" id="screen">
    <div class="loading">
        SOON LOADING WAIT xD<span class="dots" id="dots">.</span>
    </div>
    <div class="number" id="number">
        0
    </div>
    <div class="rate" id="rate">
        1,000 / SECOND
    </div>
</div>
<div class="progress"></div>
<script>
const screen = document.getElementById("screen");
const numberElement = document.getElementById("number");
const dots = document.getElementById("dots");
const rateElement = document.getElementById("rate");
let number = 0;
// Starts at 1,000 numbers/sec
let rate = 1000;
// Rate increases continuously
let acceleration = 1.015;
// Timing
let lastTime = performance.now();
// ----------------------------------------------------
// INFINITE COUNTER
// ----------------------------------------------------
function counterLoop(time) {
    const delta = (time - lastTime) / 1000;
    lastTime = time;
    // Increase the counter according to current speed
    number += rate * delta;
    numberElement.textContent =
        Math.floor(number).toLocaleString();
    // Speed increases with time
    rate *= Math.pow(acceleration, delta * 60);
    rateElement.textContent =
        Math.floor(rate).toLocaleString() + " / SECOND";
    // Tiny distortion as the speed gets higher
    const intensity =
        Math.min(1.08, 1 + Math.log10(rate) * 0.005);
    numberElement.style.transform =
        `scale(${intensity})`;
    requestAnimationFrame(counterLoop);
}
requestAnimationFrame(counterLoop);
// ----------------------------------------------------
// LOADING DOTS
// ----------------------------------------------------
let dotCount = 0;
setInterval(() => {
    dotCount++;
    if (dotCount > 3) {
        dotCount = 0;
    }
    dots.textContent = ".".repeat(dotCount);
}, 250);
// ----------------------------------------------------
// RAPID BLACK / WHITE VISUAL PULSES
// ----------------------------------------------------
let phase = 0;
function visualPulse() {
    phase++;
    /*
       Alternates between dark and light using
       short fades instead of an extreme hard strobe.
    */
    const wave = (Math.sin(phase * 0.9) + 1) / 2;
    const brightness =
        Math.round(wave * 255);
    screen.style.background =
        `rgb(${brightness}, ${brightness}, ${brightness})`;
    screen.style.color =
        brightness > 130 ? "#000" : "#fff";
    requestAnimationFrame(visualPulse);
}
visualPulse();
// ----------------------------------------------------
// RANDOM GLITCH MOMENTS
// ----------------------------------------------------
setInterval(() => {
    const x = (Math.random() - 0.5) * 8;
    const y = (Math.random() - 0.5) * 5;
    screen.style.transform =
        `translate(${x}px, ${y}px)`;
    setTimeout(() => {
        screen.style.transform = "translate(0,0)";
    }, 50);
}, 700);
</script>
</body>
</html>
